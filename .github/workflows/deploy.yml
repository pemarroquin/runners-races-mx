name: Deploy web preview (runningapp.pmarroquin.com)

# Builds the Expo web export on every push to main and publishes the built
# output (landing page + runningapp/) to the `deploy` branch. Porkbun's
# Static Hosting "GitHub Connect" (Domain Management -> pmarroquin.com ->
# Static Hosting -> GitHub Connect) watches that branch and auto-publishes
# it — this workflow exists because Porkbun's GitHub Connect only serves a
# branch's root as-is, with no build step of its own, and this repo's
# source isn't the deployable output (it needs `expo export` first).
#
# The runningapp/ directory in the published branch is mapped to the
# runningapp.pmarroquin.com subdomain via Porkbun's Static Hosting
# "Subdomains" feature (points a subdomain at a directory inside the
# shared static-hosting root) — app.json has no baseUrl, so the export's
# asset paths are root-relative and only resolve correctly when
# runningapp/ is served as that subdomain's own document root.
#
# See deploy/DEPLOY.md for the manual fallback and the history of gotchas
# this replaced (zip-upload unwrap behavior, root-absolute asset paths).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Fails loudly, before anything else, if a required EXPO_PUBLIC_* var
      # isn't set as a repo secret — a missing one otherwise builds a bundle
      # that compiles and deploys fine while shipping a feature silently
      # dead (Territory sync, 2026-08-31: EXPO_PUBLIC_SUPABASE_URL/ANON_KEY
      # were absent from this workflow's secrets, and the app correctly
      # detected that and reported 'disabled' on every save — nothing in
      # the app code was wrong, only what this workflow gave it to build
      # with). Fastest-failing first, same order this repo validates in
      # everywhere else. See scripts/check-web-env.mjs for the full story.
      - name: Check web env vars
        env:
          EXPO_PUBLIC_MAPBOX_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run check-env

      - name: Type-check
        run: npx tsc --noEmit

      - name: Export web build
        env:
          EXPO_PUBLIC_MAPBOX_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo export -p web

      # Checking that the env vars were SET (the step above) proves the
      # workflow tried to pass them in — not that Expo's bundler actually
      # inlined them into the artifact that ships. This is the check that
      # would have caught the real bug: it tests dist/, the thing that
      # actually deploys, not the environment the build ran in. Presence
      # only, never echoed — `grep -q` prints nothing on a match, and the
      # empty-string guard exists because `grep -F ""` matches every file
      # trivially, which would make a genuinely-missing secret pass silently.
      - name: Verify Supabase config shipped in the bundle
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || ! grep -rqF -- "$EXPO_PUBLIC_SUPABASE_URL" dist/; then
            echo "::error::EXPO_PUBLIC_SUPABASE_URL is not present in the built dist/ bundle — the web export shipped without Territory sync configured."
            exit 1
          fi
          if [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ] || ! grep -rqF -- "$EXPO_PUBLIC_SUPABASE_ANON_KEY" dist/; then
            echo "::error::EXPO_PUBLIC_SUPABASE_ANON_KEY is not present in the built dist/ bundle — the web export shipped without Territory sync configured."
            exit 1
          fi
          echo "Confirmed: both Supabase env vars are present in the shipped bundle."

      - name: Inline critical CSS
        run: node scripts/inline-critical-css.mjs dist

      # Deep links and share previews. `web.output: "single"` emits one
      # index.html, and Porkbun has no SPA rewrite, so /race/<id> used to 404
      # on every shared link and every hard reload. This writes a real file
      # per race route (plus 404.html) and gives each one its own title and
      # OpenGraph description. See the script header and deploy/DEPLOY.md.
      - name: Generate route files + share metadata
        run: node scripts/finalize-web.mjs dist

      - name: Assemble site (landing page + runningapp/)
        run: |
          rm -rf site-build
          mkdir -p site-build
          cp web/index.html site-build/index.html
          cp -R dist site-build/runningapp

      - name: Publish to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site-build
          publish_branch: deploy
          force_orphan: true
